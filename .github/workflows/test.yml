name: CI

on:
  push:
    branches: [main, master, remediation/2026-10-24, "remediation/**"]
  pull_request:
    branches: [main, master, remediation/2026-10-24, "remediation/**"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22.12'
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./... -race -count=1
      - name: Lint
        run: |
          if command -v golangci-lint &> /dev/null; then
            golangci-lint run
          else
            echo "golangci-lint not installed, skipping"
          fi